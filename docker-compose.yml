services:
  # ─── DynamoDB Local ──────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    container_name: tickets-dynamodb
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Aplicación Spring Boot ──────────────────────────────
  app:
    build: .
    container_name: tickets-app
    ports:
      - "8080:8080"
    environment:
      # Credenciales AWS dummy — DynamoDB Local no las valida,
      # pero el SDK v2 requiere que existan en la cadena
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      # Endpoint apunta al contenedor de DynamoDB por hostname de Compose
      - AWS_DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_DYNAMODB_REGION=us-east-1
      - AWS_DYNAMODB_EVENTS_TABLE_NAME=events
    depends_on:
      dynamodb-local:
        condition: service_healthy
